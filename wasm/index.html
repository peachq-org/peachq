<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peachq — q in your browser (WASM)</title>
<style>
  html,body{height:100%;margin:0;background:#1e2124;color:#e6e6e6;
    font-family:'SF Mono','DejaVu Sans Mono',Menlo,Consolas,monospace;}
  #wrap{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto;}
  header{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid #333;font-size:14px;color:#9fe89f;}
  header code{color:#7fb3ff;}
  header span{flex:1;}
  #status{color:#8a8a8a;}
  button{background:#2b2f33;color:#e6e6e6;border:1px solid #444;font:inherit;font-size:12px;padding:2px 8px;cursor:pointer;}
  #out{flex:1;overflow-y:auto;padding:12px 14px;white-space:pre-wrap;font-size:15px;line-height:1.4;}
  .in{color:#7fb3ff;} .res{color:#e6e6e6;} .err{color:#ff8080;} .sys{color:#8a8a8a;}
  #bar{display:flex;align-items:center;border-top:1px solid #333;padding:8px 14px;}
  #prompt{color:#00da1a;font-weight:bold;margin-right:6px;}
  #inp{flex:1;background:transparent;border:none;outline:none;color:#e6e6e6;
    font:inherit;caret-color:#00da1a;}
</style>
</head>
<body>
<div id="wrap">
  <header><span>peachq WebAssembly REPL — try <code>til 5</code>, <code>\ls</code>, <code>\l trades.q</code></span>
    <span id="status">loading</span><button id="restart">restart</button></header>
  <div id="out"></div>
  <div id="bar"><span id="prompt">q)</span><input id="inp" autofocus autocomplete="off" spellcheck="false"></div>
</div>
<script src="peachq-client.js"></script>
<script>
  const out = document.getElementById('out');
  const inp = document.getElementById('inp');
  const statusEl = document.getElementById('status');
  const hist = []; let hi = -1; let q = null;

  function line(txt, cls) {
    const d = document.createElement('div');
    d.className = cls; d.textContent = txt;
    out.appendChild(d); out.scrollTop = out.scrollHeight;
  }

  PeachQ.start({ onStatus: (s) => { statusEl.textContent = s; } })
    .then((session) => { q = session; line('peachq ready.', 'sys'); inp.focus(); })
    .catch((e) => line('failed to load: ' + e.message, 'err'));

  document.getElementById('restart').onclick = () => {
    if (!q) return;
    q.restart().then(() => line('restarted.', 'sys'), (e) => line('restart failed: ' + e.message, 'err'));
  };

  async function evalLine(src) {
    line('q)' + src, 'in');
    if (!q) { line('(still loading…)', 'err'); return; }
    try {
      const { out: text, err } = await q.eval(src);
      if (text) line(text, 'res');
      if (err) line(err, 'err');
    } catch (e) {
      line(e.message, 'err');
    }
  }

  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const v = inp.value.trim();
      if (v) { hist.push(v); hi = hist.length; evalLine(v); }
      inp.value = ''; e.preventDefault();
    } else if (e.key === 'ArrowUp') {
      if (hi > 0) { hi--; inp.value = hist[hi]; } e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (hi < hist.length - 1) { hi++; inp.value = hist[hi]; }
      else { hi = hist.length; inp.value = ''; }
      e.preventDefault();
    }
  });
</script>
</body>
</html>
